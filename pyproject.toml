[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
(
  migrations
  | \.venv
  | venv
  | build
  | dist
  | node_modules
)
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
# You can add your internal packages here (e.g., known_first_party = ["auth"])
# known_first_party = []
# Provide search paths for first-party code
src_paths = ["edx-platform-43274-43395", "edx-platform-43274-43395/User Authentication Service"]

[tool.ruff]
# General settings
line-length = 88
target-version = "py311"
respect-gitignore = true
extend-exclude = ["migrations", ".venv", "venv", "build", "dist", "node_modules"]

[tool.ruff.lint]
# Enable a solid baseline of rules + import sorting (I) and modernizations (UP)
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "C4", "ARG", "RUF"]
# Compatibility with Black on slicing and line break rules
ignore = ["E203", "W503"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # Allow package exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
